<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hook &amp; Sell: Fishing to Atlantis</title>
<style>
:root{
  --ink:#0b2540; --ink2:#4a6076; --panel:#fff8ec; --card:#ffffff; --card-sh:#eadfca;
  --blue:#2f8cff; --blue-d:#1a5fb8; --green:#22c46b; --green-d:#16924e;
  --gold1:#ffd766; --gold2:#ffb300; --gold-d:#c27c00; --red:#ff3b5c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a2a4a;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.modal canvas{display:block;margin:0 auto}
#ui{position:fixed;inset:0;pointer-events:none;color:var(--ink)}
.pe{pointer-events:auto}
button{font:inherit;cursor:pointer}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.money{display:inline-flex;align-items:center;gap:8px;background:rgba(6,26,48,.78);color:#fff;font-weight:900;font-size:22px;padding:5px 16px 5px 5px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .12s}
.money.bump{transform:scale(1.08)}
.coin{width:28px;height:28px;border-radius:50%;flex:none;display:inline-block;vertical-align:middle;
  background:radial-gradient(circle at 34% 30%,#fff7c9 0 16%,#ffd84d 42%,#e3a400 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 2px #b27500}
.coin.sm{width:17px;height:17px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.18),0 0 0 1.5px #b27500}
.goal{margin-top:8px;display:none;align-items:center;gap:6px;max-width:250px;background:rgba(255,248,236,.94);color:var(--ink);font-weight:800;font-size:13px;line-height:1.25;padding:6px 11px;border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.goal.show{display:inline-flex;flex-wrap:wrap}
.gbar{position:relative;display:block;width:100%;min-width:170px;height:16px;margin-top:4px;border-radius:999px;background:rgba(6,26,48,.14);overflow:hidden}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#2f8cff,#22c46b)}
.gbar.blue i{background:linear-gradient(90deg,#2f8cff,#8fe9ff)}
.gbar b{position:relative;display:block;text-align:center;font-size:11px;line-height:16px;color:var(--ink)}
#shopBtn.ready{animation:shopGlow 1.4s ease-in-out infinite}
/* the guided first purchase: only the shop can be touched, and in the shop only the Line */
#ui.guide #albumBtn,#ui.guide #crewBtn,#ui.guide #lbBtn{opacity:.35;pointer-events:none}
#ui.guide .hintArrow{font-size:16px;background:var(--gold2)}
#ui.guide .hintArrow::after{border-top-color:var(--gold2)}
.hintArrow.bump,.card.bump{animation:gBump .4s}
@keyframes gBump{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.card.dim{opacity:.32;pointer-events:none}
.card.pick{outline:3px solid var(--gold2);box-shadow:0 0 0 7px rgba(255,216,77,.3),0 3px 0 var(--card-sh)}
.card.pick .buy{animation:shopGlow 1.1s ease-in-out infinite}
.card .ptr{font-size:26px;flex:none;animation:gPtr .7s ease-in-out infinite}
@keyframes gPtr{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.guideTip{background:var(--gold2);color:#3a2a00;font-weight:900;font-size:15px;line-height:1.25;border-radius:14px;padding:10px 12px;margin-bottom:10px;text-align:center}
@keyframes shopGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,0)}50%{box-shadow:0 0 0 5px rgba(255,216,77,.85),0 0 18px 4px rgba(255,216,77,.6)}}
.nextBuy{margin:6px 0 10px;font-weight:800;font-size:15px}
.nextBuy.can{color:#1c9c55}
#ui .top>div:first-child,#lbBtn,#soundBtn{transition:opacity .3s}
#ui.cine .top>div:first-child,#ui.cine #lbBtn,#ui.cine #soundBtn{opacity:0;pointer-events:none}
.sealRow{display:flex;align-items:center;gap:7px;margin:10px 2px 2px;padding:9px 12px;border-radius:14px;background:linear-gradient(#1c2a66,#101a44);color:#dff3ff;font-weight:800;font-size:14px}
.sealRow b{margin-right:auto}.sealRow i{font-style:normal;opacity:.85}
.gem{width:13px;height:13px;transform:rotate(45deg);border-radius:3px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(160,220,255,.45)}
.gem.on{background:linear-gradient(135deg,#eafcff,#4fc3ff 55%,#1f6fe0);box-shadow:0 0 8px 2px rgba(120,210,255,.8)}
.newsPic{display:flex;justify-content:center;margin:4px 0 2px}
.goal.boost{background:linear-gradient(#fff3b8,#ffd24d);color:#5a3500;margin-top:6px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:rgba(6,26,48,.78);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.iconbtn svg{width:24px;height:24px}
.topR{display:flex;gap:8px}
.hi.rainbow{background:linear-gradient(120deg,#ffd1e8,#fff3b0,#c8ffd4,#c9e6ff,#e7d1ff)}
.cele{position:absolute;z-index:81;pointer-events:none;text-align:center;font-weight:900;white-space:nowrap;transform:translate(-50%,-50%);animation:multPop 2.4s cubic-bezier(.2,.9,.3,1.3) forwards}
.cele b{position:relative;display:block;font-size:40px;line-height:1.05;background:linear-gradient(#fff8d2,#ffd23f 45%,#f08a24);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #7a3d00;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)) drop-shadow(0 0 14px rgba(255,210,63,.8))}
.cele.epic b{font-size:48px;background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff36b,#6bffb8,#5fc9ff,#b98bff);-webkit-background-clip:text;background-clip:text}
.cele span{position:relative;display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;background:rgba(6,26,48,.88);color:#fff;font-size:15px}
.cele i{position:absolute;left:50%;top:40%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:repeating-conic-gradient(rgba(255,215,90,.45) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:multRays 2.4s linear forwards}
.confetti{position:absolute;z-index:82;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:conf 1.6s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.wheelBox{position:relative;width:260px;height:260px;margin:4px auto 8px}
.wheelBox canvas{width:260px;height:260px}
.wheelPtr{position:absolute;left:50%;top:-6px;margin-left:-14px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid #e2463b;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
#wheelTxt{min-height:44px}
.rules{display:grid;gap:8px;margin:8px 0 14px;text-align:left}
.rules div{background:rgba(6,26,48,.06);border-radius:14px;padding:10px 12px;font-weight:800;font-size:17px;line-height:1.25;color:var(--ink)}
.mult{position:absolute;z-index:80;pointer-events:none;text-align:center;font-weight:900;white-space:nowrap;transform:translate(-50%,-50%);animation:multPop 1.6s cubic-bezier(.2,.9,.3,1.3) forwards}
.mult b{position:relative;display:block;font-size:88px;line-height:1;background:linear-gradient(#fff8d2,#ffd23f 45%,#f08a24);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #7a3d00;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25)) drop-shadow(0 0 16px rgba(255,210,63,.85))}
.mult span{position:relative;display:inline-block;margin-top:6px;padding:5px 14px;border-radius:999px;background:rgba(6,26,48,.88);color:#fff;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mult i{position:absolute;left:50%;top:38%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:repeating-conic-gradient(rgba(255,215,90,.5) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:multRays 1.6s linear forwards}
@keyframes multPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-14deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(5deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-75%) scale(.92)}}
@keyframes multRays{from{transform:rotate(0) scale(.5)}to{transform:rotate(80deg) scale(1.15)}}
.sumPulse{display:inline-block;animation:sumPulse .9s ease-out;color:#e08a00!important}
@keyframes sumPulse{0%{transform:scale(1)}25%{transform:scale(1.3)}100%{transform:scale(1)}}
#lbBtn{display:none}
#lbBtn.on{display:grid}
.lbRow{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-top:6px;border-radius:14px;background:rgba(6,26,48,.06);font-weight:800;color:var(--ink)}
.lbRow.me{background:linear-gradient(#fff3b8,#ffd24d)}
.lbRow .rk{width:30px;text-align:center;font-weight:900}
.lbRow .nmL{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbRow img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.lbMsg{padding:18px 6px;text-align:center;font-weight:700;color:var(--ink);opacity:.75}
.pauseBox h2{margin:4px 0 16px;font-size:28px;font-weight:900}
.pauseBox .btn{width:100%}
.bottom{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;transition:transform .25s,opacity .25s}
.bottom.hide{transform:translateY(140%);opacity:0}
.btn{flex:1;border:0;border-radius:18px;padding:13px 10px;font-weight:900;font-size:18px;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);position:relative;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.btn svg{width:22px;height:22px;flex:none}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.btn.gold{background:linear-gradient(var(--gold1),var(--gold2));color:#5a3500;box-shadow:0 5px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 2px 0 var(--gold-d)}
.btn.gray,.btn:disabled{background:#a7b2bd;color:#eef2f5;box-shadow:0 5px 0 #77838f;cursor:default}
.btn:disabled:active{transform:none;box-shadow:0 5px 0 #77838f}
.badge{position:absolute;top:-9px;right:-6px;background:var(--red);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 6px;font-size:15px;display:none;place-items:center;animation:pulse .9s infinite;box-shadow:0 2px 0 #a8002a}
.badge.show{display:grid}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.hintArrow{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom) + 86px);background:#fff;color:var(--ink);font-weight:900;font-size:15px;padding:8px 12px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.2);display:none;animation:bob 1s ease-in-out infinite;white-space:nowrap}
.hintArrow::after{content:"";position:absolute;left:70px;bottom:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.hintArrow.show{display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.backdrop{position:absolute;inset:0;background:rgba(3,15,30,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;display:flex;flex-direction:column;background:var(--panel);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35);transform:translateY(106%);transition:transform .3s cubic-bezier(.2,.9,.3,1.15);pointer-events:auto;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.sheetHead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheetHead h2{margin:0;font-size:24px;font-weight:900;color:var(--ink)}
.sheetBody{overflow:auto;padding:4px 14px calc(env(safe-area-inset-bottom) + 18px);-webkit-overflow-scrolling:touch}
.crewBubble{position:absolute;display:none;transform:translate(-50%,-100%);border:0;background:#fff;color:var(--ink);border-radius:12px;padding:5px 9px 6px;font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.crewBubble.show{display:block}
.crewBubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.crewBubble .cbTop{display:flex;align-items:center;gap:5px}
.crewBubble .cbBar{display:block;height:5px;background:#e6ecf1;border-radius:4px;margin-top:4px;overflow:hidden}
.crewBubble .cbBar i{display:block;height:100%;width:0;background:var(--green);border-radius:4px}
.crewBubble.full{background:#fff0c2;animation:pulse .9s infinite}
.crewBubble.full::after{border-top-color:#fff0c2}
.crewBubble.full .cbBar i{background:var(--red)}
.scene{border-radius:18px;overflow:hidden;box-shadow:0 3px 0 var(--card-sh);margin-bottom:10px;background:#8fd8ff}
.scene canvas{display:block;width:100%;height:auto}
.crewStats{display:flex;justify-content:space-between;gap:10px;margin:2px 4px 6px;font-weight:800;color:var(--ink2);font-size:14px}
.crewStats b{color:var(--ink);font-size:16px;margin-left:4px}
.holdBar{height:12px;background:#e6dcc6;border-radius:8px;overflow:hidden;margin:0 2px 12px}
.holdBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c46b,#8be36a);border-radius:8px;transition:width .25s}
.holdBar.full i{background:linear-gradient(90deg,#ff3b5c,#ff8a5c)}
.upgH{margin:18px 4px 8px;font-size:17px;font-weight:900;color:var(--ink)}
.x{width:38px;height:38px;border-radius:12px;border:0;background:#eadfca;color:var(--ink);font-size:20px;font-weight:900}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 3px 0 var(--card-sh)}
.card .ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;flex:none}
.card .ic svg{width:34px;height:34px}
.card .info{flex:1;min-width:0}
.card .name{font-weight:900;font-size:17px;color:var(--ink);display:flex;align-items:center;gap:6px}
.lvpill{font-size:12px;font-weight:900;background:#e9f2ff;color:var(--blue-d);border-radius:999px;padding:2px 8px;white-space:nowrap}
.card .eff{font-size:13.5px;color:var(--ink2);font-weight:800;margin-top:2px}
.card .eff b{color:var(--green-d)}
.buy{flex:none;min-width:98px;padding:10px 12px;font-size:16px;border-radius:14px}
.buy .coin{width:18px;height:18px}
.buy.flash{animation:flash .35s}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.zoneSec{margin-bottom:16px}
.zoneHead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 8px}
.zoneHead h3{margin:0;font-size:17px;font-weight:900}
.zoneHead span{font-size:13px;font-weight:800;color:var(--ink2)}
.zoneHead span.on{color:var(--green-d)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:14px;padding:6px 4px 7px;text-align:center;box-shadow:0 3px 0 var(--card-sh);position:relative}
.tile canvas{position:static;width:100%;height:auto;display:block}
.tile .tn{font-size:12px;font-weight:900;line-height:1.15;min-height:28px;display:flex;align-items:center;justify-content:center}
.tile .tc{font-size:11px;font-weight:800;color:var(--ink2)}
.tile.boss{background:linear-gradient(#fff4d6,#ffe7ad)}
.tile.wide{grid-column:1/-1}.tile.wide canvas{width:32%;margin:0 auto}
.tile .star{position:absolute;top:4px;right:6px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c9,#ffc400 60%,#c98a00);box-shadow:0 0 6px #ffd24d;display:none}
.tile .star.on{display:block}
.tile .rbw{position:absolute;top:4px;right:26px;width:16px;height:16px;border-radius:50%;background:conic-gradient(#ff5f6d,#ffc371,#fff36b,#6bffb8,#5fc9ff,#b98bff,#ff5f6d);box-shadow:0 0 6px rgba(185,139,255,.8);display:none}
.tile .rbw.on{display:block}
.tile.rainbow{background:linear-gradient(135deg,#ffe3ef,#fff6cf,#dcffe8,#dcefff,#efe1ff)}
.rar{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
.modalWrap{position:absolute;inset:0;background:rgba(3,15,30,.6);display:none;align-items:center;justify-content:center;padding:18px;pointer-events:auto}
.modalWrap.show{display:flex}
.modal{background:var(--panel);border-radius:26px;padding:20px 16px 16px;width:min(380px,100%);max-height:92%;overflow:auto;text-align:center;animation:pop .38s cubic-bezier(.2,.9,.3,1.4);box-shadow:0 10px 0 rgba(0,0,0,.18)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{margin:2px 0 8px;font-size:26px;font-weight:900;color:var(--ink)}
.modal p{margin:6px 0 12px;font-weight:700;color:var(--ink2);font-size:15px;line-height:1.35}
.bigsum{display:flex;align-items:center;justify-content:center;gap:10px;font-size:40px;font-weight:900;color:var(--ink);margin:6px 0 10px}
.bigsum .coin{width:40px;height:40px}
.haul{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 12px}
.hi{background:#fff;border-radius:12px;padding:3px 6px 4px;box-shadow:0 2px 0 var(--card-sh);font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:center;min-width:64px}
.hi canvas{position:static;width:60px;height:34px}
.hi.gold{background:linear-gradient(#fff7cf,#ffe28a)}
.hi.boss{background:linear-gradient(#ffe9b0,#ffc94d)}
.row{display:flex;gap:10px;margin-top:6px}
.row .btn{font-size:16px;padding:13px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.stat{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 0 var(--card-sh)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.stat span{font-size:12px;font-weight:800;color:var(--ink2)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 30%);display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{background:#fff;color:var(--ink);font-weight:900;font-size:16px;padding:9px 16px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:toast 2.4s forwards;display:flex;align-items:center;gap:8px;max-width:88%;text-align:center}
.toast.gold{background:linear-gradient(#fff3b8,#ffd24d);color:#5a3500}
.toast.new{background:linear-gradient(#e2fff0,#a9f5cb)}
.toast.bad{background:#ffe1e6;color:#8a0020}
.toast .tag{background:var(--red);color:#fff;border-radius:8px;padding:2px 7px;font-size:12px}
@keyframes toast{0%{transform:translateY(-14px) scale(.8);opacity:0}10%{transform:none;opacity:1}82%{transform:none;opacity:1}100%{transform:translateY(-10px);opacity:0}}
.adBox{background:#111;color:#fff;border-radius:18px;padding:26px 20px;width:min(320px,100%);text-align:center;font-weight:800}
.adBox .bar{height:8px;background:#333;border-radius:8px;overflow:hidden;margin-top:16px}
.adBox .bar i{display:block;height:100%;width:0;background:var(--gold2);transition:width 1.6s linear}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="top">
    <div>
      <div class="money pe" id="moneyPill"><span class="coin"></span><span id="money">0</span></div><br>
      <div class="goal" id="goal"></div><br><div class="goal boost" id="boost"></div>
    </div>
    <div class="topR">
      <button class="iconbtn pe" id="lbBtn" aria-label="Leaderboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg></button>

function rrC(c, x0, y0, w, h, r) { c.beginPath(); c.moveTo(x0 + r, y0); c.arcTo(x0 + w, y0, x0 + w, y0 + h, r); c.arcTo(x0 + w, y0 + h, x0, y0 + h, r); c.arcTo(x0, y0 + h, x0, y0, r); c.arcTo(x0, y0, x0 + w, y0, r); c.closePath(); }

/* ============================ loop, pause & boot ================= */
/* a payout saves the money at once, then shows it arriving: coins stream from (sx, sy) to the
   money pill while the counter climbs in sync */
function payout(n, sx, sy, dur) { payHold += n; payouts.push({ left: n, rate: n / dur, sx, sy, acc: 0 }); }
function updatePayouts(dt) {
  for (const p of payouts) {
    const d = Math.min(p.left, p.rate * dt); p.left -= d; payHold = Math.max(0, payHold - d);
    p.acc += dt * 38;
    while (p.acc >= 1) { p.acc--; uparts.push({ x: p.sx + rand(-14, 14), y: p.sy + rand(-10, 10), vx: rand(-230, 230), vy: rand(-300, -60), t: 0, delay: rand(.05, .22) }); }
    if (Math.random() < dt * 12) sfx.coin(Math.floor(Math.random() * 8));
  }
  payouts = payouts.filter(p => p.left > .5);
  if (!payouts.length) payHold = 0;
}
function updateCine(dt) {

  zoomK += (zoomTo - zoomK) * Math.min(1, dt * 5);
  if (meet) updateMeet(dt);
  if (!cine) { rainbowSlow = Math.max(0, rainbowSlow - dt); timeScale = rainbowSlow > 0 ? .3 : 1; return; }
  cine.t += dt;

    // close-up on the hook while the boss bites, in slow motion
    zoomCx = hook.x; zoomCy = hook.y - camY;
    if (cine.t < .9) { zoomTo = 1.9; timeScale = .28; }
    else { zoomTo = 1; timeScale = Math.min(1, timeScale + dt * 2.5); }
    if (cine.t > 1.6) { cine = null; timeScale = 1; zoomTo = 1; }
  } else if (cine.type === 'haul') {
    // close-up on the boat: the boss comes out of the water, lands on deck, the money pours in
    zoomCx = VW * .46; zoomCy = -camY - 40;
    zoomTo = cine.t < 3.4 ? 1.65 : 1;
    const it = cine.it;
    if (!cine.landed && cine.t >= 1.55) {
      cine.landed = true; shake = 14; (it.rainbow ? sfx.rainbow : sfx.boss)(); Snd.noise(.4, .35, 300);
      for (let i = 0; i < 26; i++) parts.push({ x: VW * .42 + rand(-60, 60), y: -30, vx: rand(-160, 160), vy: rand(-320, -120), life: rand(.5, .9), max: .9, type: 'drop', r: rand(2, 4.5) });
      for (let i = 0; i < 60; i++) parts.push({ x: VW * .42 + rand(-40, 40), y: -90, vx: rand(-220, 220), vy: rand(-420, -140), life: rand(1.2, 2), max: 2, type: 'conf', r: rand(3, 5), c: ['#ffd84d', '#ff5a6e', '#22c46b', '#2f8cff', '#ffffff'][i % 5], rot: rand(0, 6) });
      S.m += it.val; S.te += it.val;
      const bx = (VW * .44 - zoomCx) * zoomK + zoomCx, by = (-60 - camY - zoomCy) * zoomK + zoomCy;
      payout(it.val, bx + offX, by, 1.5);
    }
    if (cine.t > 3.9) { cine = null; zoomTo = 1; sellTimer = .15; }
  }
}
/* performance_sample (Playgama's telemetry contract): the frame times of active dives, one aggregated event about every 30 s of diving.

const PERF = { buf: new Float32Array(4096), n: 0, ms: 0, t0: 0, skip: true };
document.addEventListener('visibilitychange', () => { PERF.skip = true; });
function perfFrame(raw) {

}

  track('performance_sample', { target_fps: 60, window_ms: Math.round(performance.now() - PERF.t0), active_ms: Math.round(ms), frame_count: n,
    fps_avg: r1(n / ms * 1000), fps_p10: r1(1000 / pct(.9)), frame_time_p50_ms: r1(pct(.5)), frame_time_p95_ms: r1(pct(.95)), frame_time_p99_ms: r1(pct(.99)), frame_time_max_ms: r1(a[n - 1]),
    frames_over_50ms: over(50), frames_over_100ms: over(100), frames_over_250ms: over(250), frames_over_500ms: over(500), frames_over_1000ms: over(1000),
    zone: S.l[3] + 1, lite: LITE });
}
// slow devices: when a dive runs under ~40 frames a second for a while, the richest creatures drop their glows and their dust for the rest of the session
let LITE = false, slowMs = 0;
function frame(ts) {
  if (paused) { rafId = 0; return; }
  const raw = ts - (lastT || ts), dt = Math.min(.05, raw / 1000); lastT = ts;
  if (started && (phase === 'down' || phase === 'up')) perfFrame(raw);
  // (never in the first seconds: a page that is still loading is not a slow device)
